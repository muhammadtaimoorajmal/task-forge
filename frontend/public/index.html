    <!-- Loading Optimization -->
    <style>
      /* Critical CSS for loading state */
      #root {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      
      /* Loading spinner */
      .app-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        font-size: 1.2rem;
        font-weight: 500;
      }
    </style>
  </head>
  
  <body>
    <!-- Progressive Enhancement -->
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif; background: #f8f9fa; color: #333; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div style="max-width: 600px; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
          <h1 style="color: #6366F1; margin-bottom: 20px; font-size: 2.5rem;">🚀 JavaScript Required</h1>
          <p style="font-size: 1.2rem; line-height: 1.6; margin-bottom: 25px;">
            TaskForge is a modern web application that requires JavaScript to function properly. 
            Please enable JavaScript in your browser to continue.
          </p>
          <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: left; margin-bottom: 25px;">
            <h3 style="margin-bottom: 15px; color: #495057;">How to enable JavaScript:</h3>
            <ul style="text-align: left; line-height: 1.8;">
              <li><strong>Chrome:</strong> Settings → Privacy and Security → Site Settings → JavaScript → Allowed</li>
              <li><strong>Firefox:</strong> Options → Privacy & Security → Permissions → Enable JavaScript</li>
              <li><strong>Safari:</strong> Preferences → Security → Enable JavaScript</li>
              <li><strong>Edge:</strong> Settings → Cookies and site permissions → JavaScript → Allowed</li>
            </ul>
          </div>
          <p style="color: #6c757d; font-size: 0.9rem;">
            If you continue to experience issues, please contact our support team.
          </p>
        </div>
      </div>
    </noscript>
    
    <!-- React App Root -->
    <div id="root">
      <!-- Loading state shown until React hydrates -->
      <div class="app-loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading TaskForge...</div>
      </div>
    </div>

    <!-- Error Boundary Recovery Script -->
    <script>
      // Global error handler for better UX
      window.addEventListener('error', function(e) {
        console.error('Application error:', e.error);
        // Could send to error reporting service
      });
      
      // Service Worker Registration (for PWA)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('SW registered: ', registration);
            })
            .catch(function(registrationError) {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
